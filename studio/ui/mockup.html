<title>Highlight Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a Windows 11 app window: title bar with live status, left navigation pane, scrolling content, docked merge queue on the right, flyouts and dialogs above. */
:root{
  --desk:#dfe3e8; --bg:#f3f3f3; --surface:#fafafa; --card:#ffffff; --card-hover:#f6f6f6;
  --stroke:#e3e3e3; --stroke-strong:#cfcfcf; --fg:#1b1b1b; --fg2:#5d5d5d; --fg3:#8b8b8b;
  --accent:#005fb8; --accent-hover:#0b6cc7; --accent-fg:#ffffff; --accent-soft:#e1edf8;
  --ok:#0f7b0f; --ok-soft:#dff6dd; --warn:#8a5300; --warn-soft:#fff4ce; --bad:#c42b1c; --bad-soft:#fde7e9;
  --muted-soft:#ececec; --scrim:rgba(0,0,0,.32); --shadow:rgba(0,0,0,.14); --hover:rgba(0,0,0,.045);
  --g-valorant:#e0435a; --g-abi:#c99a2e; --g-gzw:#3f9a62; --g-wardogs:#7a6bd1; --g-desktop:#6b7a8f;
  --font:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --font-display:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-sm:4px; --r-md:8px; --r-lg:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#101214; --bg:#202020; --surface:#272727; --card:#2d2d2d; --card-hover:#323232;
  --stroke:#3a3a3a; --stroke-strong:#4a4a4a; --fg:#ffffff; --fg2:#c8c8c8; --fg3:#9a9a9a;
  --accent:#60cdff; --accent-hover:#7dd6ff; --accent-fg:#002235; --accent-soft:#17344a;
  --ok:#6ccb5f; --ok-soft:#1f3a1e; --warn:#fce100; --warn-soft:#3d3416; --bad:#ff99a4; --bad-soft:#442726;
  --muted-soft:#383838; --scrim:rgba(0,0,0,.55); --shadow:rgba(0,0,0,.5); --hover:rgba(255,255,255,.06);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --desk:#101214; --bg:#202020; --surface:#272727; --card:#2d2d2d; --card-hover:#323232;
  --stroke:#3a3a3a; --stroke-strong:#4a4a4a; --fg:#ffffff; --fg2:#c8c8c8; --fg3:#9a9a9a;
  --accent:#60cdff; --accent-hover:#7dd6ff; --accent-fg:#002235; --accent-soft:#17344a;
  --ok:#6ccb5f; --ok-soft:#1f3a1e; --warn:#fce100; --warn-soft:#3d3416; --bad:#ff99a4; --bad-soft:#442726;
  --muted-soft:#383838; --scrim:rgba(0,0,0,.55); --shadow:rgba(0,0,0,.5); --hover:rgba(255,255,255,.06);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--fg);font:14px/20px var(--font);
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:var(--r-sm)}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* window */
.window{height:100%;min-height:620px;max-width:1500px;margin:0 auto;background:var(--bg);border:1px solid var(--stroke-strong);
  border-radius:var(--r-md);overflow:hidden;display:grid;grid-template-rows:44px 1fr;box-shadow:0 16px 48px var(--shadow);position:relative}
.titlebar{display:flex;align-items:center;gap:12px;padding-left:14px;background:var(--bg);min-width:0}
.appmark{width:18px;height:18px;border-radius:5px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);flex:none}
.appmark svg{width:12px;height:12px}
.apptitle{font-size:12px;color:var(--fg2);white-space:nowrap}
.tb-spacer{flex:1}
.disk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg2);white-space:nowrap}
.disk .bar{width:90px;height:4px;border-radius:2px;background:var(--muted-soft);overflow:hidden}
.disk .bar i{display:block;height:100%;background:var(--fg2)}
.tb-btn{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid transparent;border-radius:var(--r-sm);background:transparent;font-size:13px;white-space:nowrap}
.tb-btn:hover{background:var(--hover)}
.tb-btn[aria-pressed="true"]{background:var(--card);border-color:var(--stroke)}
.count{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-size:11px;line-height:18px;text-align:center;font-weight:600}
.count.zero{background:var(--muted-soft);color:var(--fg2)}
.spin{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.caption{display:flex;height:100%}
.caption span{width:46px;display:grid;place-items:center;font-size:11px;color:var(--fg2)}

.body{display:grid;grid-template-columns:200px minmax(0,1fr) auto;min-height:0;border-top:1px solid var(--stroke)}
/* nav */
.nav{display:flex;flex-direction:column;gap:2px;padding:8px 6px;background:var(--bg);border-right:1px solid var(--stroke)}
.nav button{display:flex;align-items:center;gap:12px;height:38px;padding:0 12px;border:0;border-radius:var(--r-sm);background:transparent;text-align:left;position:relative;font-size:14px}
.nav button:hover{background:var(--hover)}
.nav button[aria-current="page"]{background:var(--card);box-shadow:0 0 0 1px var(--stroke)}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:2px;background:var(--accent)}
.nav .ic{width:18px;height:18px}
.nav .badge{margin-left:auto;font-size:12px;color:var(--fg3)}
.nav .grow{flex:1}

/* main */
main{overflow:auto;min-width:0;background:var(--surface);position:relative;display:flex;flex-direction:column}
.page{padding:20px 28px 96px;flex:1}
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.pagehead h1{font:600 28px/36px var(--font-display);margin:0;letter-spacing:-.01em}
.pagehead .sub{color:var(--fg2);font-size:13px;margin-bottom:5px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.search{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;background:var(--card);border:1px solid var(--stroke);border-bottom-color:var(--stroke-strong);border-radius:var(--r-sm);min-width:0;width:240px;max-width:100%}
.search input{border:0;outline:0;background:transparent;width:100%;min-width:0}
.search .ic{color:var(--fg3)}
.select{height:32px;padding:0 8px;background:var(--card);border:1px solid var(--stroke);border-bottom-color:var(--stroke-strong);border-radius:var(--r-sm)}
.seg{display:inline-flex;border:1px solid var(--stroke);border-radius:var(--r-sm);background:var(--card);overflow:hidden}
.seg button{height:30px;padding:0 10px;border:0;background:transparent;display:flex;align-items:center;gap:6px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg)}
.toolbar .grow{flex:1}

/* groups */
.group{margin-bottom:22px}
.ghead{display:flex;align-items:center;gap:10px;padding:6px 0 10px;flex-wrap:wrap}
.ghead .toggle{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:4px 6px 4px 2px;border-radius:var(--r-sm);font:600 16px/22px var(--font-display)}
.ghead .toggle:hover{background:var(--hover)}
.ghead .toggle .ic{transition:transform .15s;color:var(--fg2)}
.group:not(.collapsed) .ghead .toggle .ic{transform:rotate(90deg)}
.gdot{width:8px;height:8px;border-radius:50%;flex:none}
.gmeta{color:var(--fg3);font-size:13px}
.ghead .grow{flex:1}
.linkbtn{border:0;background:transparent;color:var(--accent);font-size:13px;padding:4px 6px;border-radius:var(--r-sm)}
.linkbtn:hover{background:var(--hover)}
.group.collapsed .gbody{display:none}
.sub-ghead{display:flex;align-items:center;gap:8px;margin:4px 0 10px 4px;color:var(--fg2);font-size:13px}
.sub-ghead strong{color:var(--fg);font-weight:600}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.grid.small{grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}
.card{position:relative;border-radius:var(--r-md);padding:6px 6px 10px;border:1px solid transparent;background:transparent;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{background:var(--card-hover);border-color:var(--stroke)}
.card.selected{background:var(--accent-soft);border-color:var(--accent)}
.card.disabled .thumb{opacity:.6}
.thumb{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--muted-soft);max-width:100%}
.thumb.portrait{aspect-ratio:9/16}
.thumb svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.thumb .pan{transition:transform .08s linear}
.thumb .scrub{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);opacity:0;pointer-events:none}
.thumb:hover .scrub{opacity:1}
.thumb .scrubtime{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;font-size:11px;padding:1px 6px;border-radius:3px;opacity:0;pointer-events:none}
.thumb:hover .scrubtime{opacity:1}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;line-height:16px;padding:1px 6px;border-radius:3px}
.chk{position:absolute;left:6px;top:6px;width:22px;height:22px;border-radius:5px;border:1.5px solid rgba(255,255,255,.9);background:rgba(0,0,0,.28);display:grid;place-items:center;color:#fff;opacity:0;transition:opacity .1s;padding:0}
.chk .ic{width:14px;height:14px;stroke-width:2.2;opacity:0}
.card:hover .chk,.card.selected .chk,.chk:focus-visible{opacity:1}
.card.selected .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.card.selected .chk .ic{opacity:1}
.pill{position:absolute;right:6px;top:6px;display:flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;white-space:nowrap}
.st-done{background:var(--ok-soft);color:var(--ok)}
.st-new{background:var(--accent-soft);color:var(--accent)}
.st-processing,.st-queued{background:var(--warn-soft);color:var(--warn)}
.st-failed{background:var(--bad-soft);color:var(--bad)}
.st-too_small,.st-recording{background:var(--muted-soft);color:var(--fg2)}
.pill .ic{width:13px;height:13px;stroke-width:2}
.rec-dot{width:7px;height:7px;border-radius:50%;background:var(--bad);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.35)}
.progress i{display:block;height:100%;background:var(--warn);transition:width .4s}
.cname{font-weight:600;font-size:14px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.cmeta{display:flex;gap:10px;color:var(--fg2);font-size:12px;line-height:16px;padding:0 2px;flex-wrap:wrap}
.score{position:absolute;right:6px;top:6px;min-width:30px;height:22px;padding:0 7px;border-radius:11px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.score.top{background:var(--accent);color:var(--accent-fg)}
.used{display:inline-flex;align-items:center;gap:4px;color:var(--fg3)}
.inqueue{color:var(--accent);font-weight:600}

/* details table */
.tablewrap{overflow-x:auto;border:1px solid var(--stroke);border-radius:var(--r-md);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
th{font-weight:600;text-align:left;color:var(--fg2);padding:8px 10px;border-bottom:1px solid var(--stroke);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--stroke);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover)}
tbody tr.selected{background:var(--accent-soft)}
td.r,th.r{text-align:right}
.tpill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:10px;font-size:12px;font-weight:600}
.boxchk{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--fg3);background:var(--card);display:grid;place-items:center;padding:0;color:var(--accent-fg)}
.boxchk .ic{width:12px;height:12px;stroke-width:2.4;opacity:0}
.boxchk[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.boxchk[aria-checked="true"] .ic{opacity:1}

/* command bar */
.cmdbar{position:sticky;bottom:12px;margin:0 auto;width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 8px 8px 16px;background:var(--card);border:1px solid var(--stroke);border-radius:var(--r-lg);box-shadow:0 8px 28px var(--shadow);
  transform:translateY(0);transition:transform .18s ease,opacity .18s;z-index:5}
.cmdbar.hide{transform:translateY(24px);opacity:0;pointer-events:none}
.cmdbar .info{font-size:13px;color:var(--fg2);margin-right:8px;white-space:nowrap}
.cmdbar .info strong{color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--stroke);border-bottom-color:var(--stroke-strong);background:var(--card);font-size:14px;white-space:nowrap}
.btn:hover{background:var(--card-hover)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{color:var(--bad)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:var(--card)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:28px;padding:0 10px;font-size:13px}

/* queue */
.queue{width:320px;border-left:1px solid var(--stroke);background:var(--bg);display:flex;flex-direction:column;min-height:0}
.queue[hidden]{display:none}
.qhead{display:flex;align-items:center;gap:8px;padding:16px 16px 8px}
.qhead h2{font:600 16px/22px var(--font-display);margin:0}
.qhead .grow{flex:1}
.qlist{list-style:none;margin:0;padding:4px 10px;overflow:auto;flex:1;min-height:80px;display:flex;flex-direction:column;gap:4px}
.qitem{display:grid;grid-template-columns:16px 64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--stroke)}
.qitem.dragging{opacity:.4}
.qitem.over{box-shadow:0 -2px 0 var(--accent)}
.qitem .grip{cursor:grab;color:var(--fg3)}
.qitem .grip .ic{stroke-width:2.6}
.qitem .mini{aspect-ratio:16/9;border-radius:4px;overflow:hidden;position:relative;width:64px}
.qitem .t{min-width:0}
.qitem .t b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem .t span{display:block;font-size:12px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:28px;height:28px;border:0;border-radius:var(--r-sm);background:transparent;display:grid;place-items:center;color:var(--fg2);padding:0}
.iconbtn:hover{background:var(--hover);color:var(--fg)}
.qempty{padding:24px 16px;color:var(--fg2);font-size:13px;text-align:center}
.timeline{margin:6px 16px 4px;position:relative;height:28px;border-radius:5px;background:var(--muted-soft);display:flex;overflow:hidden}
.timeline i{display:block;height:100%;border-right:2px solid var(--bg);min-width:4px}
.timeline .limit{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg)}
.tl-label{display:flex;justify-content:space-between;padding:0 16px;font-size:12px;color:var(--fg2)}
.tl-label.over{color:var(--bad)}
.qopts{padding:12px 16px;display:grid;gap:10px;border-top:1px solid var(--stroke);margin-top:10px}
.field{display:grid;grid-template-columns:84px minmax(0,1fr);align-items:center;gap:8px;font-size:13px}
.field label{color:var(--fg2)}
.field input[type=text]{height:30px;padding:0 8px;border:1px solid var(--stroke);border-bottom-color:var(--stroke-strong);border-radius:var(--r-sm);background:var(--card);min-width:0;width:100%}
.musicpick{display:flex;gap:6px;min-width:0}
.musicpick span{flex:1;min-width:0;height:30px;line-height:28px;padding:0 8px;border:1px solid var(--stroke);border-radius:var(--r-sm);background:var(--card);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--fg2)}
.switch{width:40px;height:20px;border-radius:10px;border:1px solid var(--fg2);background:transparent;position:relative;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--fg2);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{left:23px;background:var(--accent-fg)}
.qactions{display:flex;gap:8px;padding:12px 16px 16px}
.qactions .btn{flex:1}

/* flyouts */
.flyout{position:absolute;top:52px;right:8px;bottom:8px;width:380px;max-width:calc(100% - 16px);background:var(--card);border:1px solid var(--stroke);border-radius:var(--r-lg);
  box-shadow:0 16px 48px var(--shadow);display:flex;flex-direction:column;z-index:20;animation:flyin .16s ease}
@keyframes flyin{from{transform:translateX(16px);opacity:0}}
.flyhead{display:flex;align-items:center;gap:8px;padding:14px 12px 10px 18px;border-bottom:1px solid var(--stroke)}
.flyhead h2{margin:0;font:600 16px/22px var(--font-display);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flybody{overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.job{border:1px solid var(--stroke);border-radius:var(--r-md);padding:12px;display:grid;gap:8px;background:var(--surface)}
.job .top{display:flex;gap:10px;align-items:flex-start}
.job .top b{display:block;font-size:13px;line-height:18px}
.job .top span{display:block;font-size:12px;color:var(--fg2)}
.job .top .grow{flex:1;min-width:0}
.steps{display:flex;gap:3px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--muted-soft)}
.steps i.done{background:var(--ok)}
.steps i.now{background:var(--warn)}
.job .stepname{font-size:12px;color:var(--fg2);display:flex;justify-content:space-between}
.job .report{font-size:12px;color:var(--fg2);background:var(--card);border-radius:var(--r-sm);padding:8px 10px;border:1px solid var(--stroke)}
.sectionlabel{font-size:12px;color:var(--fg3);font-weight:600;margin-top:4px}
.detail-player{position:relative;aspect-ratio:16/9;border-radius:var(--r-md);overflow:hidden}
.bigplay{position:absolute;inset:0;margin:auto;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.6);border:0;display:grid;place-items:center;color:#fff}
.bigplay .ic{width:22px;height:22px}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.meter{font-size:12px;color:var(--fg2)}
.meter div{height:4px;border-radius:2px;background:var(--muted-soft);margin-top:4px;overflow:hidden}
.meter div i{display:block;height:100%;background:var(--accent)}
.yt{border:1px solid var(--stroke);border-radius:var(--r-md);overflow:hidden}
.yt-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 12px;border-bottom:1px solid var(--stroke);align-items:start}
.yt-row:last-child{border-bottom:0}
.yt-row small{display:block;color:var(--fg3);font-size:12px;margin-bottom:2px}
.yt-row p{margin:0;font-size:13px;line-height:19px;overflow-wrap:anywhere}

/* merged */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.mcard{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding:12px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--stroke)}
.mcard.long{grid-template-columns:minmax(0,1fr)}
.mcard .info{display:flex;flex-direction:column;gap:8px;min-width:0}
.mcard h3{margin:0;font:600 15px/20px var(--font-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .facts{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
.mcard .facts dt{color:var(--fg3)}
.mcard .facts dd{margin:0;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;line-height:18px;padding:0 7px;border-radius:9px;background:var(--muted-soft);color:var(--fg2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mactions{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}

const PAL={'Valorant':['#3b2a4a','#e0907a','#5a3f5e','#2a2233','#ff4655'],'Arena Breakout Infinite':['#4f5a63','#b3ad94','#5d6555','#353a2e','#e8c35a'],
 'Gray Zone Warfare':['#26403c','#a8c2aa','#3d5a48','#22352a','#9be3b0'],'Wardogs':['#2a3150','#9295c0','#474d73','#272a42','#b9a8ff'],'Desktop':['#2e343d','#86909c','#4a525d','#2a2f36','#cfd8e3']};
let uid=0;
function scene(key,game,portrait){
  const p=PAL[game]||PAL.Desktop; let s=seedOf(key); const rnd=()=>((s=(s*1103515245+12345)>>>0)/4294967296);
  const W=portrait?90:320,H=portrait?160:180,SW=Math.round(W*1.7),hz=H*(.5+rnd()*.12); const id='g'+(uid++);
  let hills=`M0 ${hz}`; for(let x=0;x<=SW;x+=SW/9) hills+=` L${x.toFixed(1)} ${(hz-8-rnd()*26).toFixed(1)}`; hills+=` L${SW} ${H} L0 ${H}Z`;
  let blds=''; for(let x=rnd()*20;x<SW;x+=14+rnd()*30){const w=10+rnd()*22,h=12+rnd()*(H*.28);blds+=`<rect x="${x.toFixed(1)}" y="${(hz+6-h).toFixed(1)}" width="${w.toFixed(1)}" height="${(h+H).toFixed(1)}" fill="${p[3]}"/>`}
  const sun=`<circle cx="${(SW*(.2+rnd()*.6)).toFixed(1)}" cy="${(hz*.45).toFixed(1)}" r="${(H*.09).toFixed(1)}" fill="${p[1]}" opacity=".7"/>`;
  const cx=W/2,cy=H/2;
  const hud=`<g stroke="${p[4]}" stroke-width="1.4" opacity=".9"><path d="M${cx-7} ${cy}h4M${cx+3} ${cy}h4M${cx} ${cy-7}v4M${cx} ${cy+3}v4"/></g>
   <rect x="6" y="6" width="${W*.16}" height="${W*.16}" rx="3" fill="#fff" opacity=".14"/>
   <rect x="8" y="${H-12}" width="${W*.22}" height="4" rx="2" fill="#fff" opacity=".2"/><rect x="8" y="${H-12}" width="${W*.22*(.4+rnd()*.6)}" height="4" rx="2" fill="${p[4]}" opacity=".85"/>
   <rect x="${W-8-W*.12}" y="${H-14}" width="${W*.12}" height="7" rx="2" fill="#fff" opacity=".22"/>`;
  return `<svg class="scene" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
   <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient>
   <radialGradient id="${id}v" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient></defs>
   <g class="pan" style="transform:translateX(${-(SW-W)*.3}px)" data-span="${SW-W}">
    <rect width="${SW}" height="${H}" fill="url(#${id})"/>${sun}<path d="${hills}" fill="${p[2]}"/>${blds}
    <rect y="${hz+4}" width="${SW}" height="${H}" fill="${p[3]}" opacity=".85"/></g>
   ${hud}<rect width="${W}" height="${H}" fill="url(#${id}v)"/></svg>`;
}

/* ---------- Footage ---------- */
function filteredRecs(){
  let list=recs.filter(r=>(S.status==='all'||(S.status==='done'?r.status==='done':S.status==='new'?runnable(r):r.status===S.status))
    &&(!S.q||r.file.toLowerCase().includes(S.q.toLowerCase())));
  const sorters={newest:(a,b)=>b.ts.localeCompare(a.ts),oldest:(a,b)=>a.ts.localeCompare(b.ts),size:(a,b)=>b.gb-a.gb,length:(a,b)=>b.dur-a.dur};
  return list.sort(sorters[S.sort]);
}
function pill(r){
  if(r.status==='done')return `<span class="pill st-done">${ic('check')}${r.clips} shorts</span>`;
  if(r.status==='processing')return `<span class="pill st-processing">${ic('loader','spin')}<span data-prog-txt="${r.id}">${Math.round(r.prog*100)}%</span></span>`;
  if(r.status==='recording')return `<span class="pill st-recording"><span class="rec-dot"></span>Recording</span>`;
  return `<span class="pill st-${r.status}">${STATUS[r.status]}</span>`;
}
function recCard(r){
  const sel=S.sel.footage.has(r.id), dis=!selectable(r);
  return `<div class="card ${sel?'selected':''} ${dis?'disabled':''}" data-action="card" data-id="${r.id}" data-kind="footage" title="${r.file}">
   <div class="thumb" data-scrub="${r.dur}">${scene(r.id,r.game)}<span class="scrub"></span><span class="scrubtime num"></span>
    ${dis?'':`<button class="chk" data-action="check" data-id="${r.id}" data-kind="footage" role="checkbox" aria-checked="${sel}" aria-label="Select ${r.file}">${ic('check')}</button>`}
    ${pill(r)}<span class="dur num">${dur(r.dur)}</span>
    ${r.status==='processing'?`<span class="progress"><i data-prog="${r.id}" style="width:${r.prog*100}%"></i></span>`:''}</div>
   <div class="cname">${when(r.ts)}</div>
   <div class="cmeta num"><span>${gb(r.gb)}</span><span>${r.res}</span>${r.status==='failed'?`<span style="color:var(--bad)">${r.reason}</span>`:''}</div></div>`;
}
function recRow(r){
  const sel=S.sel.footage.has(r.id),dis=!selectable(r);
  const st=r.status==='done'?`${r.clips} shorts`:r.status==='processing'?`Processing ${Math.round(r.prog*100)}%`:STATUS[r.status];
  return `<tr class="${sel?'selected':''}" data-action="card" data-id="${r.id}" data-kind="footage">
   <td>${dis?'':`<button class="boxchk" data-action="check" data-id="${r.id}" data-kind="footage" role="checkbox" aria-checked="${sel}" aria-label="Select">${ic('check')}</button>`}</td>
   <td>${r.file}</td><td class="r num">${dur(r.dur)}</td><td class="r num">${gb(r.gb)}</td><td>${r.res}</td><td class="num">${when(r.ts)}</td>
   <td><span class="tpill st-${r.status}">${st}</span></td></tr>`;
}

   <select class="select" id="statusSel" aria-label="Status">${[['all','All statuses'],['new','Not processed'],['done','Done'],['processing','Processing'],['too_small','Too small']].map(([v,l])=>`<option value="${v}" ${S.status===v?'selected':''}>${l}</option>`).join('')}</select>
   <select class="select" id="sortSel" aria-label="Sort">${[['newest','Newest first'],['oldest','Oldest first'],['size','Largest first'],['length','Longest first']].map(([v,l])=>`<option value="${v}" ${S.sort===v?'selected':''}>${l}</option>`).join('')}</select>
   <span class="grow"></span>
   <div class="seg" role="group" aria-label="View"><button data-action="view" data-view="grid" aria-pressed="${S.view==='grid'}">${ic('grid')}Thumbnails</button><button data-action="view" data-view="table" aria-pressed="${S.view==='table'}">${ic('list')}Details</button></div>
  </div>`;
  if(!list.length) html+=`<div class="empty"><b>No recordings match</b>Clear the search or pick another status.</div>`;
  for(const g of games){

      <button class="toggle" data-action="collapse" data-g="${g}" aria-expanded="${!col}">${ic('chevron')}<span class="gdot" style="background:var(${GAMES[g]})"></span>${g}</button>
      <span class="gmeta num">${rs.length} ${rs.length===1?'recording':'recordings'}, ${gb(rs.reduce((a,r)=>a+r.gb,0))}</span><span class="grow"></span>
      <button class="linkbtn" data-action="sel-group" data-g="${g}" data-mode="new">Select not processed</button>
      <button class="linkbtn" data-action="sel-group" data-g="${g}" data-mode="all">Select all</button></div><div class="gbody">`;
    html+= S.view==='grid' ? `<div class="grid">${rs.map(recCard).join('')}</div>`

    html+=`</div></section>`;
  }
  html+=`</div>`+cmdbarFootage();
  return html;

function cmdbarFootage(){
  const sel=[...S.sel.footage].map(recOf).filter(Boolean); const n=sel.length;

  <div class="toolbar"><label class="search">${ic('search')}<input id="q" type="text" placeholder="Search shorts" value="${S.q}" aria-label="Search shorts"></label>
   <select class="select" id="minScore" aria-label="Minimum score">${[0,60,70,80].map(v=>`<option value="${v}" ${S.minScore==v?'selected':''}>${v?`Score ${v}+`:'Any score'}</option>`).join('')}</select></div>`;

       <div class="grid small" style="margin-bottom:18px">${cs.map(clipCard).join('')}</div>`;

function clipCard(c){

/* ---------- Merge queue ---------- */
const QCOL=['var(--accent)','var(--g-abi)','var(--g-gzw)','var(--g-wardogs)','var(--g-valorant)'];
function renderQueue(){
  const el=$('#queue'); el.hidden=!S.queueOpen; if(!S.queueOpen)return;
  const items=S.queue.map(clipOf).filter(Boolean); const total=items.reduce((a,c)=>a+c.len,0);
  const limit=S.fmt==='short'?180:null; const scale=limit?Math.max(limit,total):Math.max(total,1);
  el.innerHTML=`<div class="qhead"><h2>Merge queue</h2><span class="grow"></span>${items.length?`<button class="linkbtn" data-action="q-clear">Clear</button>`:''}<button class="iconbtn" data-action="toggle-queue" aria-label="Hide merge queue">${ic('x')}</button></div>
  ${items.length?`<ol class="qlist" id="qlist">${items.map((c,i)=>`<li class="qitem" draggable="true" data-qid="${c.id}">
    <span class="grip" title="Drag to reorder">${ic('grip')}</span><span class="mini">${scene(c.id,recOf(c.rec).game)}</span>
    <span class="t"><b>${c.title}</b><span class="num">${dur(c.len)}, score ${c.score}</span></span>
    <button class="iconbtn" data-action="q-remove" data-id="${c.id}" aria-label="Remove ${c.title}">${ic('x')}</button></li>`).join('')}</ol>`
   :`<div class="qempty">Select shorts and choose <b>Add to merge queue</b>. Drag them here into the order you want.</div><div style="flex:1"></div>`}
  ${items.length?`<div class="timeline" title="Raw length of each clip">${items.map((c,i)=>`<i style="width:${c.len/scale*100}%;background:${QCOL[i%QCOL.length]};opacity:${limit&&items.slice(0,i).reduce((a,x)=>a+x.len,0)>=limit?.35:1}" title="${c.title} ${dur(c.len)}"></i>`).join('')}${limit?`<span class="limit" style="left:${limit/scale*100}%"></span>`:''}</div>
   <div class="tl-label num ${limit&&total>limit?'over':''}"><span>${dur(total)} raw</span><span>${limit?(total>limit?`${dur(total-limit)} over the 3:00 Short limit`:`3:00 Short limit`):'No length limit'}</span></div>`:''}
  <div class="qopts">
   <div class="field"><label for="outName">Name</label><input type="text" id="outName" value="${S.outName}"></div>
   <div class="field"><label>Format</label><div class="seg" role="group"><button data-action="fmt" data-v="short" aria-pressed="${S.fmt==='short'}">Short 9:16</button><button data-action="fmt" data-v="long" aria-pressed="${S.fmt==='long'}">Long 16:9</button></div></div>
   <div class="field"><label for="musicSel">Music</label><select class="select" id="musicSel"><option value="any" ${S.mergeMusic==='any'?'selected':''}>Shuffle tracks that have a credit</option>${tracks.map(t=>`<option value="${t.id}" ${t.credit==='missing'?'disabled':''} ${S.mergeMusic===t.id?'selected':''}>${t.artist?t.artist+' - ':''}${t.title}${t.credit==='missing'?' (add a credit first)':''}</option>`).join('')}</select></div>
   <div class="field"><label for="styleSel">Style</label><select class="select" id="styleSel"><option value="punchy" ${S.style==='punchy'?'selected':''}>Punchy (zoom and flash on kills)</option><option value="clean" ${S.style==='clean'?'selected':''}>Clean (straight cuts)</option></select></div>
   <div class="field"><label>1440p HQ</label><button class="switch" data-action="hq" role="switch" aria-checked="${S.hq}" aria-label="1440p high quality"></button></div>
  </div>
  <div class="qactions"><button class="btn" data-action="preview" ${items.length<2?'disabled':''}>${ic('eye')}Preview cuts</button><button class="btn primary" data-action="merge" ${items.length<2?'disabled':''} title="${items.length<2?'Add at least 2 shorts':''}">${ic('stack')}Merge</button></div>`;
  bindDrag();
}
function bindDrag(){
  const list=$('#qlist'); if(!list)return; let dragId=null;
  list.querySelectorAll('.qitem').forEach(li=>{
    li.addEventListener('dragstart',e=>{dragId=li.dataset.qid;li.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}});
    li.addEventListener('dragend',()=>{li.classList.remove('dragging');list.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))});
    li.addEventListener('dragover',e=>{e.preventDefault();list.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));li.classList.add('over')});
    li.addEventListener('drop',e=>{e.preventDefault();const to=li.dataset.qid;if(!dragId||dragId===to)return;
      const q=S.queue.filter(x=>x!==dragId);q.splice(q.indexOf(to),0,dragId);S.queue=q;render()});
  });
}

/* ---------- Music ---------- */
function cover(key){
  let s=seedOf(key); const rnd=()=>((s=(s*1103515245+12345)>>>0)/4294967296); const id='c'+(uid++);
  const hues=[[262,320],[200,260],[330,20],[170,220],[20,50]][seedOf(key)%5];
  let bars=''; for(let i=0;i<24;i++){const h=8+rnd()*44;bars+=`<rect x="${6+i*3.7}" y="${50-h/2}" width="2" height="${h.toFixed(1)}" rx="1" fill="#fff" opacity=".55"/>`}
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${hues[0]} 60% 32%)"/><stop offset="1" stop-color="hsl(${hues[1]} 70% 55%)"/></linearGradient></defs><rect width="100" height="100" fill="url(#${id})"/>${bars}</svg>`;
}
function creditCell(t){
  if(t.credit==='ready')return `<span class="tpill st-done">${ic('check')}Credit ready</span>`;
  if(t.credit==='none')return `<span class="tpill st-new">No credit needed</span>`;
  return `<button class="tpill st-processing btnlike" data-action="credit" data-id="${t.id}">${ic('warn')}Add credit</button>`;
}
function pageMusic(){
  const missing=tracks.filter(t=>t.credit==='missing').length;

function jobCard(j){
  if(j.kind==='merge'){
    const si=Math.min(MSTEPS.length-1,Math.floor(j.prog*MSTEPS.length));
    return `<div class="job"><div class="top">${j.state==='done'?ic('check'):ic('loader','spin')}<div class="grow"><b>Merge: ${j.name}</b><span>${j.count} shorts, ${j.fmt==='short'?'Short 9:16':'Long 16:9'}</span></div></div>
     ${j.state==='done'?`<div class="report">Saved to E:\\Merged\\${j.name}.mp4</div><div><button class="btn sm" data-action="nav" data-page="merged">Open Merged</button></div>`
     :`<div class="steps">${MSTEPS.map((s,i)=>`<i class="${i<si?'done':i===si?'now':''}"></i>`).join('')}</div><div class="stepname"><span data-jstep="${j.id}">${MSTEPS[si]}</span><span class="num" data-jpct="${j.id}">${Math.round(j.prog*100)}%</span></div>`}</div>`;
  }
  const r=recOf(j.rec); const si=Math.min(STEPS.length-1,Math.floor(j.prog*STEPS.length));
  const name=r?`${r.game}, ${when(r.ts)}`:'Recording';
  if(j.state==='done') return `<div class="job"><div class="top"><span style="color:var(--ok)">${ic('check')}</span><div class="grow"><b>${name}</b><span>${j.model}, took ${j.took}</span></div></div><div class="report">${j.report}</div><div><button class="btn sm" data-action="nav" data-page="shorts">View shorts</button></div></div>`;
  if(j.state==='queued') return `<div class="job"><div class="top">${ic('activity')}<div class="grow"><b>${name}</b><span>${j.model}, waiting for the current job</span></div><button class="btn sm ghost" data-action="cancel" data-id="${j.id}">Cancel</button></div></div>`;
  const el=Math.round((Date.now()-j.started)/1000);
  return `<div class="job"><div class="top">${ic('loader','spin')}<div class="grow"><b>${name}</b><span>${j.model}, <span class="num" data-jel="${j.id}">${dur(el)}</span> elapsed</span></div><button class="btn sm ghost" data-action="cancel" data-id="${j.id}">Cancel</button></div>
   <div class="steps" data-jsteps="${j.id}">${STEPS.map((s,i)=>`<i class="${i<si?'done':i===si?'now':''}"></i>`).join('')}</div>
   <div class="stepname"><span data-jstep="${j.id}">Step ${si+1} of ${STEPS.length}: ${STEPS[si]}</span><span class="num" data-jpct="${j.id}">${Math.round(j.prog*100)}%</span></div></div>`;
}

/* ---------- jobs simulation (mockup only) ---------- */
function startNext(){
  if(jobs.some(j=>j.state==='running'))return;
  const n=jobs.find(j=>j.state==='queued'); if(!n)return;
  n.state='running'; n.started=Date.now(); n.prog=0; if(n.rec){const r=recOf(n.rec); r.status='processing'; r.prog=0}
}
function finishHl(j){
  const r=recOf(j.rec); const k=3+(seedOf(r.id)%3); j.state='done'; j.prog=1; j.took=dur((Date.now()-j.started)/1000);
  const names=['Opening pick','Clutch to close the round','Trade into a double','Last-second save','Clean spray transfer'];
  for(let i=1;i<=k;i++) clips.push(C(r.id,i,names[i-1],90-i*7,18+((i*13)%20),[80,75,78],0,'—','Found by the highlight maker.','#gaming'));
  r.status='done'; r.clips=k; delete r.prog;
  j.report=`${k} shorts. Best: "${names[0]}" (${90-7}).`;
  toast(`${r.game}: ${k} shorts ready`,when(r.ts),['View shorts','nav','shorts']);
}
setInterval(()=>{
  let changed=false;
  for(const j of jobs){ if(j.state!=='running')continue;
    j.prog=Math.min(1,j.prog+(j.kind==='merge'?.06:.012));
    if(j.rec){const r=recOf(j.rec); if(r) r.prog=j.prog}
    if(j.prog>=1){ if(j.kind==='merge'){j.state='done';merged.unshift(j.result);toast(`Merged "${j.name}"`,'Saved to E:\\Merged',['Open Merged','nav','merged'])} else finishHl(j); changed=true; startNext(); }
  }
  if(changed){render();return}
  // patch progress in place so hover and scroll stay put
  for(const j of jobs){ if(j.state!=='running')continue;
    if(j.rec){document.querySelectorAll(`[data-prog="${j.rec}"]`).forEach(e=>e.style.width=j.prog*100+'%');document.querySelectorAll(`[data-prog-txt="${j.rec}"]`).forEach(e=>e.textContent=Math.round(j.prog*100)+'%')}
    const steps=j.kind==='merge'?MSTEPS:STEPS, si=Math.min(steps.length-1,Math.floor(j.prog*steps.length));
    document.querySelectorAll(`[data-jpct="${j.id}"]`).forEach(e=>e.textContent=Math.round(j.prog*100)+'%');
    document.querySelectorAll(`[data-jstep="${j.id}"]`).forEach(e=>e.textContent=j.kind==='merge'?steps[si]:`Step ${si+1} of ${steps.length}: ${steps[si]}`);
    document.querySelectorAll(`[data-jsteps="${j.id}"] i`).forEach((e,i)=>e.className=i<si?'done':i===si?'now':'');
    document.querySelectorAll(`[data-jel="${j.id}"]`).forEach(e=>e.textContent=dur((Date.now()-j.started)/1000));
  }
},1000);

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]'); if(!t)return;
  const a=t.dataset.action, id=t.dataset.id, kind=t.dataset.kind;
  switch(a){
   case 'nav': S.page=t.dataset.page; S.q=''; S.detail=null; S.jobsOpen=false; if(S.page==='shorts')S.queueOpen=true; $('#toastHost').innerHTML=''; closeDialog(); render(); $('#main').scrollTop=0; break;
   case 'toggle-queue': S.queueOpen=!S.queueOpen; render(); break;
   case 'toggle-jobs': S.jobsOpen=!S.jobsOpen; S.detail=null; render(); break;
   case 'view': S.view=t.dataset.view; render(); break;
   case 'collapse': {const g=t.dataset.g; S.collapsed.has(g)?S.collapsed.delete(g):S.collapsed.add(g); render(); break}
   case 'check': {e.stopPropagation(); const s=S.sel[kind]; s.has(id)?s.delete(id):s.add(id); render(); break}
   case 'card': {const r=recOf(id); if(!selectable(r)){toast(r.status==='recording'?'This file is still being recorded':'This recording is being processed','Wait for it to finish before selecting it.');break} const s=S.sel.footage; s.has(id)?s.delete(id):s.add(id); render(); break}
   case 'open-clip': S.detail=id; S.jobsOpen=false; render(); break;
   case 'close-detail': S.detail=null; render(); break;
   case 'sel-group': {const rs=recs.filter(r=>r.game===t.dataset.g&&selectable(r)&&(t.dataset.mode==='all'||runnable(r))); const all=rs.every(r=>S.sel.footage.has(r.id)); rs.forEach(r=>all?S.sel.footage.delete(r.id):S.sel.footage.add(r.id)); render(); break}
   case 'sel-rec': {const cs=clips.filter(c=>c.rec===t.dataset.rec); const all=cs.every(c=>S.sel.shorts.has(c.id)); cs.forEach(c=>all?S.sel.shorts.delete(c.id):S.sel.shorts.add(c.id)); render(); break}
   case 'clear': S.sel[kind].clear(); render(); break;
   case 'make': {
     const rs=[...S.sel.footage].map(recOf).filter(runnable);
     rs.forEach(r=>{r.status='queued'; jobs.unshift({id:'j'+Math.random().toString(36).slice(2,7),kind:'hl',rec:r.id,model:r.game==='Valorant'?'Sonnet':'Opus (default)',prog:0,state:'queued'})});
     S.sel.footage.clear(); startNext(); S.jobsOpen=true; S.detail=null; render();
     toast(`Started ${rs.length} highlight ${rs.length===1?'job':'jobs'}`,'Each recording gets its own agent, one at a time.'); break}
   case 'cancel': {const j=jobs.find(x=>x.id===id); const r=j.rec&&recOf(j.rec); jobs=jobs.filter(x=>x!==j); if(r){r.status=j.state==='running'?'failed':'new'; if(j.state==='running')r.reason='Cancelled from Studio'; delete r.prog} startNext(); render(); toast('Job cancelled',j.state==='running'?'The recording is marked failed. Select it and choose Make highlights to retry.':''); break}
   case 'del-footage': deleteDialog('footage',[...S.sel.footage]); break;
   case 'del-shorts': deleteDialog('shorts',[...S.sel.shorts]); break;
   case 'del-one': deleteDialog('shorts',[id]); break;
   case 'del-merged': deleteDialog('merged',[id]); break;
   case 'confirm-del': {
     const ids=t.dataset.ids.split(','); closeDialog();
     if(kind==='footage'){const size=ids.reduce((a,i)=>a+recOf(i).gb,0); recs=recs.filter(r=>!ids.includes(r.id)); ids.forEach(i=>S.sel.footage.delete(i)); toast(`Moved ${ids.length} ${ids.length===1?'recording':'recordings'} to the Recycle Bin`,`${gb(size)} is freed when you empty the Recycle Bin.`)}
     else if(kind==='shorts'){clips=clips.filter(c=>!ids.includes(c.id)); S.queue=S.queue.filter(q=>!ids.includes(q)); ids.forEach(i=>S.sel.shorts.delete(i)); if(ids.includes(S.detail))S.detail=null; toast(`Moved ${ids.length} ${ids.length===1?'short':'shorts'} to the Recycle Bin`)}
     else {merged=merged.filter(m=>!ids.includes(m.id)); toast('Moved the merged video to the Recycle Bin')}
     render(); break}
   case 'dlg-close': closeDialog(); break;
   case 'add-queue': {const add=[...S.sel.shorts].filter(i=>!S.queue.includes(i)); S.queue.push(...add); S.sel.shorts.clear(); S.queueOpen=true; render(); toast(`Added ${add.length} to the merge queue`,'Drag them in the queue to change the order.'); break}
   case 'add-one': if(!S.queue.includes(id))S.queue.push(id); S.queueOpen=true; render(); break;
   case 'q-remove': S.queue=S.queue.filter(q=>q!==id); render(); break;
   case 'q-clear': S.queue=[]; render(); break;
   case 'fmt': S.fmt=t.dataset.v; render(); break;
   case 'hq': S.hq=!S.hq; render(); break;
   case 'music': toast('Opens a Windows file picker in the app','Pick one song or a folder of songs.'); break;
   case 'preview': previewDialog(); break;
   case 'merge': {
     closeDialog(); const items=S.queue.map(clipOf); const name=S.outName||'Untitled merge';
     const total=items.reduce((a,c)=>a+c.len,0)*.7;
     const res={id:'m'+Date.now(),name,fmt:S.fmt,len:Math.min(S.fmt==='short'?180:9999,total),res:S.fmt==='short'?(S.hq?'1440×2560':'1080×1920'):(S.hq?'2560×1440':'1920×1080'),tracks:S.mergeMusic==='any'?tracks.filter(t=>t.credit!=='missing').slice(0,1).map(t=>t.id):[S.mergeMusic],date:when(new Date().toISOString().slice(0,16)),gb:.12,clips:[...S.queue],game:recOf(items[0].rec).game};
     items.forEach(c=>c.used++);
     jobs.unshift({id:'jm'+Date.now(),kind:'merge',name,count:items.length,fmt:S.fmt,prog:0,state:'running',started:Date.now(),result:res});
     S.queue=[]; S.jobsOpen=true; S.detail=null; render(); break}
   case 'remerge': {const m=merged.find(x=>x.id===id); S.queue=m.clips.filter(clipOf); S.fmt=m.fmt; S.outName=m.name+' v2'; S.page='shorts'; S.queueOpen=true; render(); toast(`Loaded ${S.queue.length} shorts from "${m.name}" into the queue`,'Change the order or settings, then merge.'); break}
   case 'play-merged': {const m=merged.find(x=>x.id===id); playerDialog(m.name,m.id,m.game,m.len,m.fmt==='short'); break}
   case 'play-clip': {const c=clipOf(id); playerDialog(c.title,c.id,recOf(c.rec).game,c.len,false); break}
   case 'explorer': toast('Opens the folder in File Explorer','In the app this selects the file in Explorer.'); break;
   case 'copy': {const c=clipOf(S.detail); const v={title:c.title,desc:c.desc,tags:c.tags,hook:c.hook}[t.dataset.k];
     try{navigator.clipboard.writeText(v).then(()=>toast('Copied'),()=>toast('Copy blocked here','It works in the app.'))}catch(_){toast('Copy blocked here','It works in the app.')} break}
   case 'theme': S.theme=t.dataset.v; if(S.theme==='system')document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',S.theme); render(); break;
   case 'music-tab': S.musicTab=t.dataset.v; render(); break;
   case 'watch': S.watch=!S.watch; render(); break;
   case 'track-check': {const s=S.trackSel; s.has(id)?s.delete(id):s.add(id); render(); break}
   case 'clear-tracks': S.trackSel.clear(); render(); break;
   case 'del-tracks': {const ts=[...S.trackSel].map(trackOf); openDialog(`<div class="dlg-body"><h2>Delete ${ts.length} ${ts.length===1?'track':'tracks'}?</h2><p>The files go to the Recycle Bin. Videos you already merged keep their music.</p><div class="dlg-list">${ts.map(x=>`<div><span>${x.file}</span><span class="num">${dur(x.len)}</span></div>`).join('')}</div></div>
     <div class="dlg-foot"><button class="btn danger-solid" data-action="confirm-del-tracks">Move to Recycle Bin</button><button class="btn" data-action="dlg-close">Cancel</button></div>`); break}
   case 'confirm-del-tracks': {const n=S.trackSel.size; tracks=tracks.filter(x=>!S.trackSel.has(x.id)); if(S.trackSel.has(S.mergeMusic))S.mergeMusic='any'; S.trackSel.clear(); closeDialog(); render(); toast(`Moved ${n} ${n===1?'track':'tracks'} to the Recycle Bin`); break}
   case 'play-track': S.playing=S.playing===id?null:id; render(); break;
   case 'get-ncs': {const n=ncsCat.find(x=>x.id===id); S.waiting.add(id); render(); toast(`Opened "${n.title}" on ncs.io`,'Click Download on that page. Studio adds the file when it lands in Downloads.');
     setTimeout(()=>{S.waiting.delete(id); tracks.push({id:'t'+Date.now(),title:n.title,artist:n.artist,source:'NCS',len:n.len,credit:'ready',text:ncsCredit(n.artist,n.title),file:`${n.artist} - ${n.title}.mp3`}); render(); toast(`Added "${n.title}" to your music`,'Credit line filled in from ncs.io.',['Open library','music-lib'])},3500); break}
   case 'music-lib': S.page='music'; S.musicTab='library'; $('#toastHost').innerHTML=''; render(); break;
   case 'goto-ncs': S.musicTab='ncs'; S.ncsQ=t.dataset.q; render(); break;
   case 'lookup': S.link=($('#linkIn')||{}).value||''; if(!S.link.trim()){toast('Paste a video link first');break} S.lookup=true; render(); break;
   case 'open-ytal': toast('Opens YouTube Studio\'s Audio Library in your browser','Tracks you download there are added here automatically.'); break;
   case 'import': {tracks.push({id:'t'+Date.now(),title:'my_track',artist:'',source:'Imported file',len:200,credit:'missing',text:'',file:'my_track.mp3'}); S.musicTab='library'; render(); creditDialog(tracks[tracks.length-1].id); break}
   case 'credit': creditDialog(id); break;
   case 'credit-save': {const x=trackOf(id); x.title=$('#cTitle').value; x.artist=$('#cArtist').value; x.source=$('#cSource').value; x.text=$('#cText').value.trim();
     x.credit=$('#cNone').checked?'none':x.text?'ready':'missing'; closeDialog(); render(); toast(x.credit==='missing'?'Saved without a credit line':'Credit saved',x.credit==='missing'?'This track can\'t be used in merges until it has one.':''); break}
   case 'desc': descDialog(id); break;
   case 'copy-desc': {const v=$('#descTxt').value; try{navigator.clipboard.writeText(v).then(()=>toast('Description copied'),()=>{$('#descTxt').select();toast('Copy blocked here','The text is selected. Press Ctrl+C.')})}catch(_){$('#descTxt').select();toast('Copy blocked here','The text is selected. Press Ctrl+C.')} break}
   case 'toast-x': $('#toastHost').innerHTML=''; break;
  }
});
document.addEventListener('dblclick',e=>{
  const c=e.target.closest('[data-kind="footage"].card'); if(c){const r=recOf(c.dataset.id); playerDialog(r.file,r.id,r.game,r.dur,false)}
  const s=e.target.closest('[data-kind="shorts"].card'); if(s){const x=clipOf(s.dataset.id); playerDialog(x.title,x.id,recOf(x.rec).game,x.len,false)}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value; const pos=e.target.selectionStart; render(); const q=$('#q'); q.focus(); q.setSelectionRange(pos,pos)}
  if(e.target.id==='outName') S.outName=e.target.value;
  if(e.target.id==='linkIn') S.link=e.target.value;
  if(e.target.id==='ncsQ'){S.ncsQ=e.target.value; const pos=e.target.selectionStart; render(); const q=$('#ncsQ'); q.focus(); q.setSelectionRange(pos,pos)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='statusSel'){S.status=e.target.value;render()}
  if(e.target.id==='sortSel'){S.sort=e.target.value;render()}
  if(e.target.id==='minScore'){S.minScore=+e.target.value;render()}
  if(e.target.id==='styleSel'){S.style=e.target.value}
  if(e.target.id==='musicSel'){S.mergeMusic=e.target.value}
  if(e.target.id==='genreSel'){S.genre=e.target.value;render()}
});
/* hover scrub: pan the frame and show the timestamp under the cursor */
document.addEventListener('mousemove',e=>{
  const th=e.target.closest('.thumb[data-scrub]'); if(!th)return;
  const b=th.getBoundingClientRect(), f=Math.max(0,Math.min(1,(e.clientX-b.left)/b.width));
  const g=th.querySelector('.pan'); if(g) g.style.transform=`translateX(${-(+g.dataset.span)*f}px)`;
  const sc=th.querySelector('.scrub'); if(sc) sc.style.left=(f*100)+'%';
  const st=th.querySelector('.scrubtime'); if(st) st.textContent=dur(+th.dataset.scrub*f);
});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea'))return;
  if(e.key==='Escape'){ if(S.detail||S.jobsOpen){S.detail=null;S.jobsOpen=false;render()} }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'&&(S.page==='footage'||S.page==='shorts')){
    e.preventDefault(); if(S.page==='footage') filteredRecs().filter(selectable).forEach(r=>S.sel.footage.add(r.id)); else clips.forEach(c=>S.sel.shorts.add(c.id)); render(); }
  if(e.key==='Delete'){ if(S.page==='footage'&&S.sel.footage.size)deleteDialog('footage',[...S.sel.footage]); if(S.page==='shorts'&&S.sel.shorts.size)deleteDialog('shorts',[...S.sel.shorts]); }
});

/* opening state: two recordings selected so the command bar is visible */
S.sel.footage.add('v2'); S.sel.footage.add('a3');
render();
})();
</script>
