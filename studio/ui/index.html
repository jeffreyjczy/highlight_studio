<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Highlight Studio</title>
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="appmark" aria-hidden="true"><svg viewBox="0 0 20 20" class="ic"><path d="M6.5 4.5v11l9-5.5z" fill="currentColor" stroke="none"/></svg></span>
    <span class="apptitle">Highlight Studio</span>
    <span class="tb-spacer"></span>
    <span class="disk num" id="disk" title="Free space"></span>
    <button class="tb-btn" data-action="toggle-queue" id="qBtn" aria-pressed="false"></button>
    <button class="tb-btn" data-action="toggle-jobs" id="jBtn" aria-pressed="false"></button>
  </header>
  <div class="body">
    <nav class="nav" id="nav" aria-label="Pages"></nav>
    <main id="main"><div class="page"><div class="empty"><b>Loading</b>Reading your folders…</div></div></main>
    <aside class="queue" id="queue" aria-label="Merge queue" hidden></aside>
  </div>
  <div id="flyout"></div>
  <div id="toastHost"></div>
</div>
<dialog id="dlg"></dialog>
<audio id="audio" preload="none"></audio>
<script src="/ui/app.js"></script>
</body>
</html>
